name: CI

on:
  pull_request:          # whenever a pull request is opened or updated
  push:
    branches: [main]     # and whenever something lands on main

# If you push again while a run is still going, cancel the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # download our code onto the runner
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Check for mistakes
        # Looks for real errors: unused imports, undefined names, syntax problems.
        run: ruff check .

  tests:
    name: Tests (logic, database, permissions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                       # reuse downloads between runs
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests --ignore=tests/gui

  gui:
    name: GUI smoke test (headless Qt)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen         
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install system libraries that Qt needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libglib2.0-0 fonts-dejavu-core
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run GUI tests
        run: python -m pytest tests/gui
